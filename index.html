<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Third Pour</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Independent specialty coffee shops in Boston, Sacramento, New York, San Francisco and Mexico City, ranked by what you want from your next cup.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: a handwritten café guide. Chalk-hand lettering leads, a typewriter face labels,
   and every shop gets its own painted stripe in vintage-sneaker tones: cream, navy, oxblood, olive, sky, wood. */
:root {
  /* Black and white lead; oxblood, olive and the stripe tones are small touches */
  --bg: #FFFFFF;
  --surface: #FAFAFA;
  --ink: #0A0A0A;
  --muted: #6B6B6B;
  --line: #E3E3E3;
  --accent: #8E2C2A;      /* oxblood */
  --on-accent: #FFFFFF;
  --olive: #4D5A33;       /* corduroy green */
  --olive-soft: #ECEEE2;
  --shadow: rgba(0, 0, 0, .08);
  /* card stripes */
  --s1: #1F2A4A; --s2: #8A2A28; --s3: #55603A; --s4: #8FAACB; --s5: #B5895A;
  --font-hand: "Schoolbell", "Bradley Hand", "Comic Sans MS", cursive;
  --font-type: var(--font-hand);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #000000; --surface: #0E0E0E; --ink: #FFFFFF; --muted: #A3A3A3; --line: #2B2B2B;
    --accent: #E07A70; --on-accent: #000000; --olive: #B5C28D; --olive-soft: #1E2318;
    --shadow: rgba(255, 255, 255, .06);
    --s1: #8EA3D6; --s2: #E07A70; --s3: #B5C28D; --s4: #B7CBE3; --s5: #D2A673;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #000000; --surface: #0E0E0E; --ink: #FFFFFF; --muted: #A3A3A3; --line: #2B2B2B;
  --accent: #E07A70; --on-accent: #000000; --olive: #B5C28D; --olive-soft: #1E2318;
  --shadow: rgba(255, 255, 255, .06);
  --s1: #8EA3D6; --s2: #E07A70; --s3: #B5C28D; --s4: #B7CBE3; --s5: #D2A673;
  color-scheme: dark;
}
/* City pages are strictly black and white: color touches stay on the home page only */
body[data-view="city"] {
  --accent: var(--ink); --on-accent: var(--bg);
  --olive: var(--ink); --olive-soft: var(--line);
  --s1: var(--ink); --s2: var(--ink); --s3: var(--ink); --s4: var(--ink); --s5: var(--ink);
}
/* Easy-read font: swaps the handwriting for a high-legibility face everywhere */

* { box-sizing: border-box; }
html, body { background: var(--bg); }
body { color: var(--ink); font-family: var(--font-hand); font-size: 19px; line-height: 1.4; transition: background-color .25s, color .25s; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.wrap {
  max-width: 1200px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
h1, h2, h3 { margin: 0; font-family: var(--font-hand); font-weight: 400; text-wrap: balance; }
button, a { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.label { font-family: var(--font-type); font-size: 16px; letter-spacing: .02em; color: var(--muted); }

/* Sticky header: brand, city tabs, reading toggles */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-bottom: 1.5px dashed var(--line); }
.top .wrap { display: flex; align-items: center; gap: 16px; padding-block: 10px; }
.brand { font-size: 28px; white-space: nowrap; display: flex; align-items: center; gap: 8px; background: none; border: 0; padding: 0; text-decoration: none; }
.brand-mark { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--ink); position: relative; flex: none; }
.brand-mark::after { content: ""; position: absolute; inset: 3px; border-radius: 50%; background: var(--accent); }

.tabs-box { flex: 1; min-width: 0; display: flex; align-items: center; gap: 2px; }
.tabs-scroll { flex: 1; min-width: 0; overflow-x: auto; overscroll-behavior-x: contain; scroll-behavior: smooth; scrollbar-width: thin; scrollbar-color: var(--line) transparent; padding-bottom: 4px; margin-bottom: -4px;
  -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 var(--fade-l, 0px), #000 calc(100% - var(--fade-r, 0px)), transparent 100%);
          mask-image: linear-gradient(90deg, transparent 0, #000 var(--fade-l, 0px), #000 calc(100% - var(--fade-r, 0px)), transparent 100%); }
.tabs-scroll::-webkit-scrollbar { height: 4px; }
.tabs-scroll::-webkit-scrollbar-thumb { background: var(--line); border-radius: 4px; }
.tabs { display: flex; gap: 4px; width: max-content; margin-left: auto; }
.tab { border: 1.5px solid transparent; background: transparent; border-radius: 999px; padding: 4px 14px; font-size: 20px; white-space: nowrap; }
.tab:hover { border-color: var(--line); }
.tab[aria-selected="true"] { background: var(--ink); color: var(--bg); }
.nudge { flex: none; width: 30px; height: 30px; border-radius: 50%; border: 1.5px solid var(--line); background: var(--surface); font-family: var(--font-type); font-size: 15px; line-height: 1; display: grid; place-items: center; padding: 0; }
.nudge:hover { border-color: var(--ink); }

.toggles { display: flex; gap: 6px; flex: none; }
.toggle { border: 1.5px solid var(--line); background: var(--surface); border-radius: 999px; padding: 3px 12px; font-size: 17px; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; }
.toggle:hover { border-color: var(--ink); }
.toggle[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.toggle.solid { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.toggle .ico { font-size: 15px; line-height: 1; }

/* Home: big city names on the left, an endless reel of café names on the right */
.home { display: grid; grid-template-columns: minmax(0, 1fr) minmax(280px, 40%); gap: 36px; padding-block: 28px 0; align-items: start; }
.cities { list-style: none; margin: 0; padding: 0 0 56px; display: grid; gap: 2px; position: sticky; top: 84px; }
.cities a { display: inline-flex; align-items: baseline; gap: 16px; font-size: clamp(48px, 7.4vw, 108px); line-height: 1.02; text-decoration: none; transition: color .15s; }
.cities a::after { content: "→"; font-size: .38em; color: var(--accent); opacity: 0; transform: translateX(-8px); transition: opacity .15s, transform .15s; }
.cities a:hover, .cities a.hot, .cities a:focus-visible { color: var(--accent); }
.cities a:hover::after, .cities a.hot::after, .cities a:focus-visible::after { opacity: 1; transform: none; }
.hero h1 span { color: var(--accent); }

.reel { position: sticky; top: 76px; height: calc(100vh - 100px); max-height: 860px; overflow: hidden;
  -webkit-mask-image: linear-gradient(transparent, #000 7%, #000 93%, transparent); mask-image: linear-gradient(transparent, #000 7%, #000 93%, transparent); }
.track { display: flex; flex-direction: column; gap: 14px; animation: reel-y 90s linear infinite; }
.reel:hover .track { animation-play-state: paused; }
@keyframes reel-y { to { transform: translateY(calc(-50% - 7px)); } }
@keyframes reel-x { to { transform: translateX(calc(-50% - 7px)); } }
.plate { flex: none; container-type: inline-size; aspect-ratio: 4 / 5; max-width: 100%; display: flex; align-items: flex-end; padding: 18px; border-radius: 2px; text-decoration: none; outline: 2px solid transparent; outline-offset: -2px; transition: outline-color .15s; }
.plate.wide { aspect-ratio: 5 / 4; }
.plate.sq { aspect-ratio: 1; }
.plate.hot, .plate:hover { outline-color: var(--accent); }
.plate .nm { font-size: 15cqi; line-height: 1; overflow-wrap: anywhere; }
.p-dark { background: var(--ink); color: var(--bg); }
.p-light { background: var(--surface); color: var(--ink); border: 1px solid var(--line); }
.p-touch { background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-top: 8px solid var(--stripe); }

/* City hero */
.hero { padding-block: 40px 28px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 24px 40px; align-items: end; }
.hero h1 { font-size: clamp(64px, 13vw, 168px); line-height: .9; letter-spacing: -.01em; }
.scribble { font-size: clamp(22px, 2.4vw, 28px); color: var(--olive); line-height: 1.2; margin-top: 12px; max-width: 36ch; transform: rotate(-1deg); transform-origin: left; }
.specs { border-top: 2px solid var(--ink); min-width: 180px; margin: 0; }
.specs div { padding: 10px 16px 10px 0; border-bottom: 1px solid var(--line); }
.specs dt { font-size: 15px; color: var(--muted); }
.specs dd { margin: 2px 0 0; font-size: 22px; font-variant-numeric: tabular-nums; }

/* Filters */
.filters { padding-block: 18px 22px; border-top: 1.5px dashed var(--line); border-bottom: 1.5px dashed var(--line); }
.filters .label { display: block; margin-bottom: 10px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1.5px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 16px; font-size: 19px; transition: background-color .15s, color .15s, border-color .15s; }
.chip:hover { border-color: var(--ink); }
.chip[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }

/* Results */
.results-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; padding-block: 22px 16px; }
.results-head h2 { font-size: 36px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 340px), 1fr)); gap: 18px; padding-bottom: 48px; }
.shop { position: relative; background: var(--surface); border: 1px solid var(--line); border-top: 8px solid var(--stripe, var(--s1)); border-radius: 18px; display: flex; flex-direction: column; min-width: 0; overflow: hidden; transition: transform .2s, box-shadow .2s, border-color .2s; }
.shop:hover { transform: translateY(-2px); box-shadow: 0 10px 24px var(--shadow); }
.shop:focus-within { border-color: var(--accent); }
/* The café name is the map link, stretched to cover the whole card */
.map-link { text-decoration: none; outline: none; }
.map-link::after { content: ""; position: absolute; inset: 0; z-index: 0; }
.shop .btn { position: relative; z-index: 1; }
.shop { cursor: pointer; }
.body { padding: 18px 20px 20px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
.rank { font-size: 16px; color: var(--muted); }
.body h3 { font-size: clamp(34px, 4vw, 42px); line-height: 1; margin-top: 2px; }
.body p { margin: 0; font-size: 19px; line-height: 1.35; }
.note { font-size: 20px; line-height: 1.25; color: var(--accent); }
.why { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 2px; }
.why span { font-size: 15px; padding: 2px 10px; border-radius: 999px; background: var(--olive-soft); color: var(--olive); }
.foot { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-top: auto; padding-top: 12px; border-top: 1.5px dashed var(--line); flex-wrap: wrap; }
.actions { display: flex; gap: 6px; }
.btn { border: 1.5px solid var(--ink); background: transparent; border-radius: 999px; padding: 2px 14px; font-size: 18px; text-decoration: none; white-space: nowrap; }
.btn.dark { background: var(--ink); color: var(--bg); }

footer { border-top: 1.5px dashed var(--line); padding-block: 22px 44px; color: var(--muted); }
footer .wrap { display: flex; justify-content: center; }

@media (max-width: 760px) {
  .top .wrap { flex-wrap: wrap; gap: 8px 12px; }
  .brand { flex: 1; }
  .tabs-box { order: 3; flex-basis: 100%; }
  .tabs { margin-left: 0; }
  .toggle .txt { display: none; }
  .toggle { padding: 6px 10px; }
  .hero { grid-template-columns: 1fr; padding-block: 26px 20px; }
  .specs { min-width: 0; }
  .home { grid-template-columns: 1fr; gap: 22px; padding-top: 16px; }
  .reel { order: -1; position: static; height: 220px; max-height: none;
    -webkit-mask-image: linear-gradient(90deg, transparent, #000 6%, #000 94%, transparent); mask-image: linear-gradient(90deg, transparent, #000 6%, #000 94%, transparent); }
  .track { flex-direction: row; height: 100%; width: max-content; animation-name: reel-x; animation-duration: 70s; }
  .plate { height: 100%; padding: 12px; }
  .cities { position: static; }
  .cities a { font-size: clamp(44px, 13vw, 72px); }
}
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; scroll-behavior: auto !important; }
  .track { animation: none !important; }
  .reel { overflow: auto; }
}
</style>
</head>

    </div>
    <div class="toggles">

  </div>
</header>

<main id="home-view" hidden>

</main>

<main id="city-view" hidden>

  <section class="wrap filters" aria-label="Your preferences">

    <div class="grid" id="grid"></div>

</main>

<footer>

    ] },
  { id: "cdmx", name: "Ciudad de México", region: "México", tz: "America/Mexico_City",
    scribble: "High altitude, so water boils cooler and brews pull a little differently.",
    shops: [
      { name: "Qūentin Café", hood: "Condesa", site: null,
        know: "Specialty espresso, banana bread",

        know: "Mexican roaster",

      { name: "Café Nin", hood: "Juárez", site: null,
        know: "Elena Reygadas' café and bakery",

        note: "Come for coffee, stay for the pastry case.", a: { work: 1, espresso: 2, pourover: 0, pastry: 3, cozy: 3, quick: 1 } }

];

const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const root = document.documentElement;

const state = {
  city: null, // null = home page
  moods: new Set(store.get("tp2-moods", ["espresso"])),
  theme: store.get("tp2-theme", "auto"),
};

const STRIPES = ["--s1", "--s2", "--s3", "--s4", "--s5"];
const shortName = (c) => ({ cdmx: "CDMX", nyc: "NYC", sf: "SF" }[c.id] || c.name);
function localTime(tz) {
  try { return new Intl.DateTimeFormat("en-US", { hour: "numeric", minute: "2-digit", timeZone: tz }).format(new Date()); }
  catch (e) { return "—"; }
}
function pickView() {
  state.city = CITIES.find((c) => c.id === location.hash.slice(1)) || null;
}

/* Reading toggles */
const THEMES = { auto: ["◐", "Auto"], light: ["☀", "Light"], dark: ["☾", "Dark"] };
function applyPrefs() {
  if (state.theme === "auto") root.removeAttribute("data-theme"); else root.setAttribute("data-theme", state.theme);
  $("theme-ico").textContent = THEMES[state.theme][0];
  $("theme-txt").textContent = THEMES[state.theme][1];
  $("theme-toggle").setAttribute("aria-label", `Theme: ${THEMES[state.theme][1]}. Click to change.`);
}

/* City tabs with visible scroll affordances */
function renderTabs() {
  const items = [{ id: "home", label: "Home", sel: !state.city }]
    .concat(CITIES.map((c) => ({ id: c.id, label: shortName(c), sel: state.city && state.city.id === c.id })));
  $("tabs").innerHTML = items.map((t) =>
    `<a class="tab" role="tab" id="tab-${t.id}" href="#${t.id}" aria-selected="${!!t.sel}">${t.label}</a>`).join("");
  const active = document.querySelector('.tab[aria-selected="true"]');
  if (active) {
    const sc = $("tabs-scroll");
    const l = active.offsetLeft - sc.offsetLeft, r = l + active.offsetWidth;
    if (l < sc.scrollLeft || r > sc.scrollLeft + sc.clientWidth) sc.scrollLeft = l - 24;
  }
  updateNudges();
}
function updateNudges() {
  const sc = $("tabs-scroll");
  const max = sc.scrollWidth - sc.clientWidth;
  const atStart = sc.scrollLeft <= 2, atEnd = sc.scrollLeft >= max - 2;
  const overflow = max > 2;
  $("nudge-left").hidden = !overflow || atStart;
  $("nudge-right").hidden = !overflow || atEnd;
  sc.style.setProperty("--fade-l", overflow && !atStart ? "28px" : "0px");
  sc.style.setProperty("--fade-r", overflow && !atEnd ? "28px" : "0px");
}
(function wireTabScroll() {
  const sc = $("tabs-scroll");
  sc.addEventListener("scroll", updateNudges, { passive: true });
  window.addEventListener("resize", updateNudges);
  // A vertical mouse wheel scrolls the city row sideways
  sc.addEventListener("wheel", (e) => {
    if (sc.scrollWidth <= sc.clientWidth || Math.abs(e.deltaX) > Math.abs(e.deltaY)) return;
    e.preventDefault(); sc.scrollLeft += e.deltaY;
  }, { passive: false });
  $("nudge-left").addEventListener("click", () => sc.scrollBy({ left: -160 }));
  $("nudge-right").addEventListener("click", () => sc.scrollBy({ left: 160 }));
})();

/* Home page */
const PLATE_SHAPES = ["", "wide", "sq", ""];
const PLATE_KINDS = ["p-dark", "p-light", "p-dark", "p-touch"];
function plate(s, c, n) {
  const shape = PLATE_SHAPES[n % PLATE_SHAPES.length];
  const kind = PLATE_KINDS[n % PLATE_KINDS.length];
  return `<a class="plate ${shape} ${kind}" href="${mapsUrl(s, c)}" target="_blank" rel="noopener" tabindex="-1" data-city="${c.id}" title="${esc(s.name)} in Maps" style="--stripe:var(${STRIPES[n % STRIPES.length]})"><span class="nm">${esc(s.name)}</span></a>`;
}
function renderHome() {
  $("city-links").innerHTML = CITIES.map((c) => `<li><a href="#${c.id}" data-city="${c.id}">${esc(c.name)}</a></li>`).join("");
  const plates = [];
  let n = 0;
  CITIES.forEach((c) => c.shops.forEach((s) => plates.push(plate(s, c, n++))));
  // Shuffle the reel so neighbors come from different cities, then loop it twice for a seamless scroll
  const mixed = plates.map((_, i) => plates[(i * 7) % plates.length]).join("");
  $("track").innerHTML = mixed + mixed;
}
// Pointing at a city lights up its cafés in the reel, and the other way round
function hot(id) {
  document.querySelectorAll("#home-view [data-city]").forEach((el) => el.classList.toggle("hot", !!id && el.dataset.city === id));
}
["city-links", "track"].forEach((k) => {
  $(k).addEventListener("mouseover", (e) => { const t = e.target.closest("[data-city]"); hot(t && t.dataset.city); });
  $(k).addEventListener("mouseleave", () => hot(null));
});

/* City page */
function renderHero() {
  const c = state.city;
  $("hero").innerHTML = `
    <div>
      <div class="label">${esc(c.region)} · coffee guide</div>
      <h1>${esc(c.name)}<span>.</span></h1>
      <div class="scribble">${esc(c.scribble)}</div>
    </div>
    <dl class="specs">
      <div><dt>Local time</dt><dd id="clock">${localTime(c.tz)}</dd></div>
    </dl>`;
}
function renderControls() {
  $("moods").innerHTML = MOODS.map((m) =>
    `<button type="button" class="chip" id="mood-${m.id}" data-mood="${m.id}" aria-pressed="${state.moods.has(m.id)}">${m.label}</button>`).join("");
}
function fit(s) { let pts = 0; state.moods.forEach((m) => { pts += s.a[m]; }); return pts; }
const mapsUrl = (s, c) => "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(`${s.name} ${s.hood} ${c.name}`);

function renderShops() {
  const c = state.city;
  if (!c) return;
  const ranked = c.shops.map((s, i) => ({ s, i, f: fit(s) })).sort((a, b) => b.f - a.f || a.i - b.i);
  $("results-title").textContent = `${shortName(c)} shortlist`;
  $("count").textContent = state.moods.size ? "sorted by what you picked" : "";
  $("grid").innerHTML = ranked.map(({ s, i }, rank) => {
    const tags = Object.entries(s.a).filter(([, v]) => v >= 2).sort((a, b) => b[1] - a[1]).slice(0, 3).map(([k]) => TAG[k]);
    const stripe = STRIPES[(i + CITIES.indexOf(c) * 2) % STRIPES.length];
    return `<article class="shop" style="--stripe:var(${stripe})">
      <div class="body">
        <span class="rank">#${rank + 1}</span>
        <h3><a class="map-link" href="${mapsUrl(s, c)}" target="_blank" rel="noopener">${esc(s.name)}</a></h3>
        <div class="label">${esc(s.hood)} · ${esc(s.know)}</div>
        <p>${esc(s.blurb)}</p>
        <div class="note">→ ${esc(s.note)}</div>
        <div class="why">${tags.map((t) => `<span>${t}</span>`).join("")}</div>
      </div>
    </article>`;
  }).join("");
}

function renderAll() {
  const home = !state.city;
  $("home-view").hidden = !home;
  $("city-view").hidden = home;
  document.body.dataset.view = home ? "home" : "city";
  renderTabs();
  if (home) renderHome(); else { renderHero(); renderShops(); }
}

document.addEventListener("click", (e) => {
  const m = e.target.closest("[data-mood]");
  if (m) {
    const id = m.dataset.mood;
    state.moods.has(id) ? state.moods.delete(id) : state.moods.add(id);
    m.setAttribute("aria-pressed", state.moods.has(id));
    store.set("tp2-moods", [...state.moods]); renderShops(); return;
  }
  if (e.target.closest("#theme-toggle")) {
    const order = ["auto", "light", "dark"];
    state.theme = order[(order.indexOf(state.theme) + 1) % order.length];
    store.set("tp2-theme", state.theme); applyPrefs();
  }
});

window.addEventListener("hashchange", () => { pickView(); renderAll(); window.scrollTo(0, 0); });
setInterval(() => {
  const el = $("clock"); if (el && state.city) el.textContent = localTime(state.city.tz);
  document.querySelectorAll(".tz").forEach((t) => { t.textContent = localTime(t.dataset.tz); });
}, 30000);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(updateNudges);

if (!THEMES[state.theme]) state.theme = "auto";
applyPrefs();
pickView();
renderControls();
renderAll();
</script>
</body>
</html>
